services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: eis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_api_key_development}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # qdrant/qdrant image does not include curl/wget; use a TCP socket probe.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eis-network

  # EIS Application
  eis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eis-app
    ports:
      - "8000:8000"
    environment:
      # Application
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: INFO

      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000"]'

      # Vector Database
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: engineering_knowledge
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_api_key_development}

      # Embedding Service (from .env)
      EMBEDDING_MODEL: text-embedding-3-large
      EMBEDDING_DIMENSION: 3072
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}

      # LLM (from .env)
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}

    depends_on:
      qdrant:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/__pycache__

    networks:
      - eis-network

    command: ["python", "main.py"]

  # Optional: Development tools container
  # dev:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dev
  #     args:
  #       - PYTHON_VERSION=3.11
  #   container_name: eis-dev
  #   working_dir: /app
  #   environment:
  #     PYTHONUNBUFFERED: "1"
  #     PYTHONDONTWRITEBYTECODE: "1"
  #   volumes:
  #     - .:/app
  #     - /app/__pycache__
  #   networks:
  #     - eis-network
  #   command: /bin/bash
  #   stdin_open: true
  #   tty: true

networks:
  eis-network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
