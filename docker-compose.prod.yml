services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: eis-qdrant
    expose:
      - "6333"
      - "6334"
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - eis-network

  # EIS Application
  eis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eis-app
    ports:
      - "8000:8000"
    environment:
      # Application
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO

      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Vector Database
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: engineering_knowledge
      QDRANT_API_KEY: ${QDRANT_API_KEY}

      # Embedding Service
      EMBEDDING_MODEL: text-embedding-3-large
      EMBEDDING_DIMENSION: 3072
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}

      # LLM
      LLM_API_KEY: ${LLM_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL}

    depends_on:
      qdrant:
        condition: service_healthy

    volumes:
      - /app/__pycache__

    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - eis-network

    command: ["python", "main.py"]

networks:
  eis-network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
